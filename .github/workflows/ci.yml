name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Force-install a known pytest version into the active Python environment (no cache) to avoid import issues
        python -m pip install --no-cache-dir -U pytest==7.4.2 setuptools

    - name: Verify pytest installed
      run: |
        set -x
        python -m pip show pytest || (python -m pip install -U pytest && python -m pip show pytest)
        python -m pip list
        python -c "import importlib, sys; print('py executable:', sys.executable); print('pytest loader:', importlib.util.find_spec('pytest'))"
        python -c "import pytest; print('pytest version:', pytest.__version__)" || true
        python -m pytest -V || true

    - name: Debug environment (if tests still fail)
      if: failure()
      run: |
        set -x
        echo "DEBUG: python and pip info"
        python -V
        python -c "import sys; print('executable:', sys.executable); print('sys.path:', sys.path)"
        python -m pip --version
        python -m pip list --format=columns
        python -c "import importlib; print('import pytest:', importlib.util.find_spec('pytest'))" || true
        ls -la
        env | sort

    - name: Run tests
      run: |
        python -m pytest -q
